name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Backend Dependencies
        working-directory: BE
        run: npm ci

      - name: Build Backend
        working-directory: BE
        run: npm run build

      - name: Test Backend
        working-directory: BE
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: FE
        run: npm ci

      - name: Build Frontend
        working-directory: FE
        run: npm run build
